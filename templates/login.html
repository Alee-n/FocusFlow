<!DOCTYPE html>
<html>

<head>
    <title>Login - FocusFlow</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #6a85b6, #8e44ad);
            text-align: center;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            background: white;
            color: black;
            padding: 30px;
            margin: 80px auto;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: gray;
            font-size: 14px;
        }

        input,
        button {
            padding: 12px;
            margin-top: 12px;
            width: 90%;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 1px solid #5c6bc0;
        }

        button {
            background: #5c6bc0;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #3f51b5;
        }

        .register-link {
            margin-top: 15px;
            display: block;
            color: #5c6bc0;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔐 FocusFlow</h1>

        <p>Login to continue your productivity journey</p>

        <form method="POST">

            <input type="text" name="username" placeholder="Enter Username" required>

            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/register" class="register-link">
            Create New Account
        </a>

    </div>

</body>

</html>
