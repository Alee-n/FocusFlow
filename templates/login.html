<!DOCTYPE html>
<html>
<head>
    <title>Login - FocusFlow</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #6a85b6, #8e44ad);
            text-align: center;
            color: white;
        }

        .container {
            background: white;
            color: black;
            padding: 20px;
            margin: 100px auto;
            width: 300px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 10px;
            width: 90%;
        }

        button {
            background: #5c6bc0;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🔐 Login to FocusFlow</h2>

    <form method="POST">
        <input name="username" placeholder="Enter your name" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
